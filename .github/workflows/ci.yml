name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dev dependencies, then the package itself
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=buffett --cov-report=term-missing --cov-fail-under=85
      - run: buffett screen CPRT GGG ROL WAT WSO
      - name: Install normally and run from another folder
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install .
          cd /tmp && /tmp/v/bin/buffett screen ROL
          /tmp/v/bin/buffett analyze ROL > /dev/null
          site=$(/tmp/v/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          test ! -e "$site/.cache" && test ! -e "$site/data"
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.txt
