[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "buffett-model"
version = "0.1.0"
description = "Deterministic implementation of a Buffett-style quality-value investment model on SEC XBRL data"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pandas>=2", "ruff==0.16.10", "mypy==2.3.1", "types-requests"]

[project.scripts]
buffett = "buffett.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buffett = ["data/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
# Briefs deliberately print typographic symbols (× − ≥ …); allow those, keep the rest of RUF001-003.
allowed-confusables = ["×", "−", "–"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# pandas is an optional dev dependency, imported lazily only by Financials.to_frame().
module = ["pandas"]
ignore_missing_imports = true
