[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buffett-model"
version = "0.1.0"
description = "Deterministic implementation of a Buffett-style quality-value investment model on SEC XBRL data"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2"]

[project.scripts]
buffett = "buffett.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
